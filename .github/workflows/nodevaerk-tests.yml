name: Nodeværk tests

on:
  push:
    paths:
      - 'nodevaerk/**'
      - '.github/workflows/nodevaerk-tests.yml'
  pull_request:
    paths:
      - 'nodevaerk/**'
      - '.github/workflows/nodevaerk-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodevaerk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nodevaerk/package-lock.json
      - run: npm ci
      - run: npm test
